name = "emscripten-goose"
main = "../../target/wasm32-unknown-emscripten/debug/deps/emscripten_goose.js"
# Recent enough that nodejs_compat auto-enables the node builtin modules the
# emscripten glue imports (node:fs >= 2025-09-15, node:dgram >= 2026-01-29).
compatibility_date = "2026-06-02"
# NODERAWSOCKETS routes emcc's socket layer through node's `net`/`dgram`,
# which workerd only exposes under the Node compat shim. The new module
# registry gives the ESM module a real `import.meta.url`, which emscripten's
# node bootstrap (`_scriptName`) needs to resolve its builtins.
compatibility_flags = ["nodejs_compat", "new_module_registry", "no_handle_cross_request_promise_resolution"]

# OpenRouter config (see README for a free API key). For real deployments
# prefer `wrangler secret put OPENROUTER_API_KEY` over an in-file var.
[vars]
OPENAI_BASE_URL = "https://openrouter.ai/api"
OPENAI_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
OPENROUTER_API_KEY = "sk-or-v1-..."

# rustc drives emcc as the linker; `-sWASM_BINDGEN=auto` makes emcc run
# wasm-bindgen as a post-link step (detected via the marker section), so the
# whole build is a single `cargo build`. The env wires up the local patch chain:
#   * PATH:      the emscripten checkout + the locally-built wasm-bindgen CLI
#                (carries the descriptor-interpreter fixes and the
#                `#[wasm_bindgen(tokio)]` support this example relies on; build
#                it once with:
#                  cargo build -p wasm-bindgen-cli --bin wasm-bindgen \
#                    --manifest-path ../../wasm-bindgen/Cargo.toml)
#   * EM_CONFIG: emsdk's .emscripten config
# Requires `rustup target add wasm32-unknown-emscripten`.
[build]
command = "EMCC_CFLAGS='-fwasm-exceptions' EM_CONFIG=/Users/gbedford/Projects/emsdk/.emscripten PATH=/Users/gbedford/Projects/emscripten:/Users/gbedford/Projects/workers-rs/wasm-bindgen/target/debug:$PATH cargo build"
